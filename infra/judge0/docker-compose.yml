version: '3.8'

x-shared-env: &shared-env
  JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?err}
  RAILS_ENV: ${RAILS_ENV:-production}
  RAILS_LOG_TO_STDOUT: 'true'
  RAILS_SERVE_STATIC_FILES: 'true'
  REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  MIN_RUNTIME_VERSION: '11.0.0'
  CPU_COUNT: ${CPU_COUNT:-4}
  MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-200}
  CONCURRENCY: ${CONCURRENCY:-4}
  RUN_USER: judge
  RUN_GROUP: judge

services:
  postgres:
    image: postgres:13-alpine
    restart: unless-stopped
    volumes:
      - judge0-pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judge0}
      POSTGRES_USER: ${POSTGRES_USER:-judge0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-judge0} -d ${POSTGRES_DB:-judge0}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512M}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?err} --appendonly yes
    volumes:
      - judge0-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256M}

  server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    environment:
      <<: *shared-env
    ports:
      - '${JUDGE0_PORT:-3000}:3000'
    volumes:
      - judge0-storage:/opt/judge0/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/about 2>/dev/null | grep -q creation_timestamp || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-1G}

  workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    environment:
      <<: *shared-env
    command: ['bash', '-c', 'rm -f tmp/pids/server.pid && bundle exec sidekiq']
    volumes:
      - judge0-storage:/opt/judge0/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${WORKERS_MEM_LIMIT:-2G}

volumes:
  judge0-pg-data:
  judge0-redis-data:
  judge0-storage:

networks:
  judge0-net:
    driver: bridge
