x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

x-shared-env: &shared-env
  JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:?err}
  RAILS_ENV: ${RAILS_ENV:-production}
  RAILS_LOG_TO_STDOUT: 'true'
  RAILS_SERVE_STATIC_FILES: 'true'
  REDIS_URL: redis://:${REDIS_PASSWORD:?err}@redis:6379/0
  DATABASE_URL: postgresql://${POSTGRES_USER:-judge0}:${POSTGRES_PASSWORD:?err}@postgres:5432/${POSTGRES_DB:-judge0}
  MIN_RUNTIME_VERSION: '11.0.0'
  CPU_COUNT: ${CPU_COUNT:-4}
  MAX_QUEUE_SIZE: ${MAX_QUEUE_SIZE:-200}
  CONCURRENCY: ${CONCURRENCY:-4}
  RUN_USER: judge
  RUN_GROUP: judge

services:
  postgres:
    image: postgres:16.2
    restart: always
    env_file: .env
    volumes:
      - judge0-pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-judge0} -d ${POSTGRES_DB:-judge0}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512M}
    <<: *default-logging

  redis:
    image: redis:7.2.4
    restart: always
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: .env
    volumes:
      - judge0-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256M}
    <<: *default-logging

  server:
    image: judge0/judge0:1.13.1
    restart: always
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    ports:
      - '${JUDGE0_PORT:-2358}:2358'
    volumes:
      - ./.env:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - judge0-storage:/opt/judge0/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:2358/api/v1/about 2>/dev/null | grep -q creation_timestamp || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEM_LIMIT:-1G}
    <<: *default-logging

  workers:
    image: judge0/judge0:1.13.1
    restart: always
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - SETUID
      - SETGID
      - SYS_RESOURCE
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      <<: *shared-env
    command: ["./scripts/workers"]
    volumes:
      - ./.env:/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - judge0-storage:/opt/judge0/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - judge0-net
    deploy:
      resources:
        limits:
          memory: ${WORKERS_MEM_LIMIT:-2G}
    <<: *default-logging

volumes:
  judge0-pg-data:
  judge0-redis-data:
  judge0-storage:

networks:
  judge0-net:
    driver: bridge
